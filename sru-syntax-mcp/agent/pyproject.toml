[project]
name = "sru-syntax-agent"
version = "0.1.0"
description = "OpenAI Agents SDK agent that uses the mcp-sru-syntax MCP server on Databricks Apps"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.25.0",
    "databricks-openai>=0.17.0",
    "databricks-sdk>=0.50.0",
    "mlflow>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
start-server = "agent_server.start_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server"]
